name: Build Ceecept APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log; test "${PIPESTATUS[0]}" -eq 0

      - name: Report failure diagnostics
        if: failure()
        run: |
          {
            echo "## :x: Build failed"
            echo
            grep -E "error:|FAILED|Execution failed|What went wrong|Caused by" build.log | head -n 40
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|e: |FAILED|Execution failed|What went wrong|Caused by|requires|Dependency '|compile against" build.log \
            | head -n 14 \
            | while IFS= read -r line; do
                line="$(printf '%s' "$line" | head -c 800 | tr '\n' ' ')"
                echo "::error::$line"
              done
          echo "::warning::tail: $(tail -n 3 build.log | tr '\n' ' ' | head -c 800)"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk "Ceecept-v${VERSION}-debug.apk"
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ceecept-debug-apk
          path: Ceecept-*-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Ceecept-debug-apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Ceecept-*-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
