name: Build Ceecept APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log; test "${PIPESTATUS[0]}" -eq 0

      - name: Report failure diagnostics
        if: failure()
        run: |
          {
            echo "## :x: Build failed"
            echo
            grep -E "error:|FAILED|Execution failed|What went wrong|Caused by" build.log | head -n 40
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|e: |FAILED|Execution failed|What went wrong|Caused by|requires|Dependency '|compile against" build.log \
            | head -n 14 \
            | while IFS= read -r line; do
                line="$(printf '%s' "$line" | head -c 800 | tr '\n' ' ')"
                echo "::error::$line"
              done
          echo "::warning::tail: $(tail -n 3 build.log | tr '\n' ' ' | head -c 800)"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk "Ceecept-v${VERSION}-debug.apk"
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ceecept-debug-apk
          path: Ceecept-*-debug.apk
          if-no-files-found: error

  smoke:
    name: Emulator launch smoke test (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Ceecept-debug-apk

      - name: Boot emulator and launch Ceecept
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          script: |
            set +e
            APK=$(ls Ceecept-*-debug.apk 2>/dev/null | head -n 1)
            {
              echo "=== devices ==="
              adb devices -l
              echo "=== apk ==="
              ls -la Ceecept-*-debug.apk
              echo "=== install ==="
              adb install -r "$APK"
              echo "install exit: $?"
              echo "=== launch ==="
              adb shell am start -n com.ceecept.music.debug/com.ceecept.music.MainActivity
              echo "=== wait 25s ==="
              sleep 25
              echo "=== pidof ==="
              adb shell pidof com.ceecept.music.debug
              echo "=== logcat filtered ==="
              adb logcat -d | grep -aiE "ceecept|AndroidRuntime|FATAL EXCEPTION" | tail -n 80
              echo "=== focused app ==="
              adb shell dumpsys activity activities | grep -aiE "mFocusedApp|mResumedActivity" | head -n 5
            } > smoke-full.txt 2>&1
            cat smoke-full.txt
            if adb shell pidof com.ceecept.music.debug > /dev/null 2>&1; then
              echo "SMOKE_ALIVE" > smoke-status.txt
            else
              echo "SMOKE_CRASHED" > smoke-status.txt
            fi
            echo "status: $(cat smoke-status.txt)"

      - name: Annotate smoke result
        if: always()
        run: |
          STATUS=$(cat smoke-status.txt 2>/dev/null || echo UNKNOWN)
          echo "Smoke status (API ${{ matrix.api }}): $STATUS"
          {
            grep -aiE "error|exception|failed|crash|caused|not found|unable" smoke-full.txt | head -n 8
            echo "--- tail ---"
            tail -n 6 smoke-full.txt
          } 2>/dev/null | while IFS= read -r line; do
            line="$(printf '%s' "$line" | head -c 800 | tr '\n' ' ')"
            echo "::error::[smoke api${{ matrix.api }}] $line"
          done
          test "$STATUS" = "SMOKE_ALIVE"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Ceecept-debug-apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Ceecept-*-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
